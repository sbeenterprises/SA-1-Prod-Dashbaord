apiVersion: 1
providers:
  - name: usv-dashboards
    orgId: 1
    folder: Swift Autonomous Dashboard
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
  # The Audit page (user names, IP addresses, control changes) in a folder
  # of its own: deploy/install.sh limits that folder to Editors and Admins
  # (operators and supervisors with the Signal K login, SK_LOGIN=1).
  - name: usv-audit
    orgId: 1
    folder: Swift Autonomous Audit
    folderUid: usv-audit-folder
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards-audit
      foldersFromFilesStructure: false
