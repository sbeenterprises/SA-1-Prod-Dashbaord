apiVersion: 1
policies:
  - orgId: 1
    receiver: usv-operations
    group_by: ["alertname"]
    group_wait: 15s
    group_interval: 1m
    repeat_interval: 30m
    routes:
      - receiver: usv-operations
        matchers:
          - severity = critical
        repeat_interval: 10m
      - receiver: usv-operations
        matchers:
          - severity = warning
        repeat_interval: 1h
