    data:
    - refId: A
      relativeTimeRange:
        from: 120
        to: 0
      datasourceUid: influxdb-usv
      model:
        refId: A
        query: "from(bucket: \"telemetry\")\n  |> range(start: -2m)\n  |> filter(fn: (r) => r._measurement\
          \ == \"engine\" and (r._field == \"oil_pressure\" or r._field == \"rpm\"))\n  |> last()\n  |>\
          \ group(columns: [\"vessel\"])\n  |> pivot(rowKey: [\"vessel\"], columnKey: [\"_field\"], valueColumn:\
          \ \"_value\")\n  |> filter(fn: (r) => exists r.rpm and exists r.oil_pressure and r.rpm > 700.0)\n\
          \  |> map(fn: (r) => ({_time: now(), _value: r.oil_pressure, vessel: r.vessel}))\n"
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
