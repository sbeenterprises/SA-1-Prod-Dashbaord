  - uid: usv-engine-temp-high
    title: Engine Temperature High
    condition: C
    for: 1m
    noDataState: OK
    execErrState: Alerting
    labels:
      severity: warning
      system: usv
    annotations:
      summary: "Engine temperature high: from 75 \xB0C on a Yamaha outboard, 95 \xB0C on a Mercury diesel,\
        \ 95 \xB0C on other engines."
    data:
    - refId: A
      relativeTimeRange:
        from: 120
        to: 0
      datasourceUid: influxdb-usv
      model:
        refId: A
        query: "from(bucket: \"telemetry\")\n  |> range(start: -2m)\n  |> filter(fn: (r) => r._measurement\
          \ == \"engine\" and r._field == \"coolant_temp\")\n  |> map(fn: (r) => ({r with _value: (if\
          \ r._value >= (if exists r.engine_type and r.engine_type == \"yamaha_outboard\" then 85.0 else\
          \ (if exists r.engine_type and r.engine_type == \"mercury_diesel\" then 100.0 else 100.0)) then\
          \ 2.0 else if r._value >= (if exists r.engine_type and r.engine_type == \"yamaha_outboard\"\
          \ then 75.0 else (if exists r.engine_type and r.engine_type == \"mercury_diesel\" then 95.0\
          \ else 95.0)) then 1.0 else 0.0)}))\n"
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        reducer: last
        expression: A
        datasource:
          type: __expr__
          uid: __expr__
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        datasource:
          type: __expr__
          uid: __expr__
        conditions:
        - evaluator:
            type: within_range
            params:
            - 0.5
            - 1.5
