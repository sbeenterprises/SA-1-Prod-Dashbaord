apiVersion: 1
groups:
- orgId: 1
  name: usv-alarms
  folder: USV Alerts
  interval: 30s
  rules:
  - uid: usv-low-battery
    title: Low Battery SOC
    condition: C
    for: 1m
    noDataState: OK
    execErrState: Alerting
    labels:
      severity: critical
      system: usv
    annotations:
      summary: "Battery state of charge below 25% \u2014 consider Return-to-Home."
    data:
    - refId: A
      relativeTimeRange:
        from: 120
        to: 0
      datasourceUid: influxdb-usv
      model:
        refId: A
        query: "from(bucket: \"telemetry\")\n  |> range(start: -2m)\n  |> filter(fn: (r) => r._measurement\
          \ == \"electrical\" and r._field == \"soc\")\n"
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        reducer: last
        expression: A
        datasource:
          type: __expr__
          uid: __expr__
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        datasource:
          type: __expr__
          uid: __expr__
        conditions:
        - evaluator:
            type: lt
            params:
            - 25
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            type: last
            params: []
          type: query
