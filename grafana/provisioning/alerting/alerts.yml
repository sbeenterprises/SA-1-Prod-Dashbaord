  - uid: usv-engine-off-mission
    title: Engine Shut Off During Mission
    condition: C
    for: 30s
    noDataState: OK
    execErrState: Alerting
    labels:
      severity: critical
      system: usv
    annotations:
      summary: 'Engine SHUT OFF during a mission: below 300 rpm while the helm drives. The boat is not
        under power.'
    data:
    - refId: A
      relativeTimeRange:
        from: 120
        to: 0
      datasourceUid: influxdb-usv
      model:
        refId: A
        query: "rpm = from(bucket: \"telemetry\")\n  |> range(start: -2m)\n  |> filter(fn: (r) => r._measurement\
          \ == \"engine\" and r._field == \"rpm\")\n  |> last()\n  |> group(columns: [\"vessel\", \"_field\"\
          ])\n  |> min()\ndrive = from(bucket: \"telemetry\")\n  |> range(start: -15s)\n  |> filter(fn:\
          \ (r) => r._measurement == \"autonomy\" and r._field == \"helm_drive\")\n  |> last()\n  |> group(columns:\
          \ [\"vessel\", \"_field\"])\n  |> min()\nunion(tables: [rpm, drive])\n  |> group(columns: [\"\
          vessel\"])\n  |> pivot(rowKey: [\"vessel\"], columnKey: [\"_field\"], valueColumn: \"_value\"\
          )\n  |> filter(fn: (r) => exists r.rpm and exists r.helm_drive and r.helm_drive > 0.5)\n  |>\
          \ map(fn: (r) => ({_time: now(), _value: r.rpm, vessel: r.vessel}))\n"
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        reducer: last
        expression: A
        datasource:
          type: __expr__
          uid: __expr__
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        datasource:
          type: __expr__
          uid: __expr__
        conditions:
        - evaluator:
            type: lt
            params:
            - 300
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            type: last
            params: []
          type: query
  - uid: usv-engine-no-data-mission
    title: No Engine Data During Mission
    condition: C
    for: 30s
    noDataState: OK
    execErrState: Alerting
    labels:
      severity: warning
      system: usv
    annotations:
      summary: 'No engine data for 30 s while the helm drives a mission: engine state unknown.'
    data:
    - refId: A
      relativeTimeRange:
        from: 120
        to: 0
      datasourceUid: influxdb-usv
      model:
        refId: A
        query: "drive = from(bucket: \"telemetry\")\n  |> range(start: -15s)\n  |> filter(fn: (r) => r._measurement\
          \ == \"autonomy\" and r._field == \"helm_drive\")\n  |> last()\n  |> group(columns: [\"vessel\"\
          ])\n  |> keep(columns: [\"vessel\", \"_field\", \"_value\"])\nrpmCount = (start, name) => from(bucket:\
          \ \"telemetry\")\n  |> range(start: start)\n  |> filter(fn: (r) => r._measurement == \"engine\"\
          \ and r._field == \"rpm\")\n  |> group(columns: [\"vessel\"])\n  |> count()\n  |> map(fn: (r)\
          \ => ({vessel: r.vessel, _field: name, _value: float(v: r._value)}))\nunion(tables: [drive,\
          \ rpmCount(start: -30s, name: \"recent\"), rpmCount(start: -1h, name: \"hour\")])\n  |> group(columns:\
          \ [\"vessel\"])\n  |> pivot(rowKey: [\"vessel\"], columnKey: [\"_field\"], valueColumn: \"_value\"\
          )\n  |> filter(fn: (r) => exists r.helm_drive and r.helm_drive > 0.5 and exists r.hour)\n  |>\
          \ map(fn: (r) => ({_time: now(), _value: if exists r.recent then r.recent else 0.0, vessel:\
          \ r.vessel}))\n"
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        reducer: last
        expression: A
        datasource:
          type: __expr__
          uid: __expr__
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        datasource:
          type: __expr__
          uid: __expr__
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            type: last
            params: []
          type: query
  - uid: usv-low-oil-pressure
