# Telegraf — onboard computer system metrics (FR-9), native deployment.
# Placeholders __INFLUX_TOKEN__ / __INFLUX_ORG__ / __VESSEL_ID__ are filled
# in by deploy/install.sh.
[agent]
  interval = "5s"
  flush_interval = "5s"

[[outputs.influxdb_v2]]
  urls = ["http://localhost:8086"]
  token = "__INFLUX_TOKEN__"
  organization = "__INFLUX_ORG__"
  bucket = "telemetry"

[global_tags]
  vessel = "__VESSEL_ID__"

# --- Host metrics ---
[[inputs.cpu]]
  percpu = false
  totalcpu = true

[[inputs.mem]]

[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "overlay", "squashfs"]

[[inputs.diskio]]

[[inputs.net]]
  ignore_protocol_stats = true

[[inputs.temp]]

[[inputs.system]]

# --- GPU (System dashboard, measurement "gpu") ---
# Intel (Arc / Xe / iGPU): the probe samples intel_gpu_top, which needs perf
# access, so it runs as root through a sudoers rule for that root-owned
# script only (written by install.sh when intel_gpu_top is installed). It
# prints nothing on hosts without an Intel GPU, so the tile reads "No data".
[[inputs.exec]]
  commands = ["sudo -n /usr/local/bin/usv_gpu_probe"]
  interval = "10s"
  timeout = "8s"
  data_format = "influx"

# NVIDIA: uncomment on hosts with nvidia-smi on the PATH. name_override makes
# it write the same "gpu" measurement the dashboard reads.
# [[inputs.nvidia_smi]]
#   timeout = "5s"
#   name_override = "gpu"

# --- Network quality (FR-8): latency + packet loss ---
[[inputs.ping]]
  urls = ["8.8.8.8", "1.1.1.1"]
  count = 3
  ping_interval = 1.0
  timeout = 2.0

# Starlink dish (vessel fit): the Comms dashboard's Starlink tile. The dish
# must be routable from the OBC (Starlink router in bypass mode, or a route
# to 192.168.100.0/24 on the boat router). Comment out on hosts without one;
# the tile then reads N/A.
[[inputs.ping]]
  urls = ["192.168.100.1"]
  count = 3
  ping_interval = 1.0
  timeout = 2.0

# --- Service supervision (FR-9): key systemd units ---
[[inputs.systemd_units]]
  pattern = "influxdb.service grafana-server.service telegraf.service usv-signalk-bridge.service usv-signalk-bridge@*.service usv-can-bridge.service signalk.service signalk@*.service moos-antler.service twingate*.service tailscaled.service openvpn*.service wg-quick@*.service"

# --- Service reachability (FR-9): Signal K, MOOSDB, InfluxDB ---
[[inputs.net_response]]
  protocol = "tcp"
  address = "localhost:3000"   # Signal K (server web/stream port)
  timeout = "3s"
  [inputs.net_response.tags]
    service = "signalk"

[[inputs.net_response]]
  protocol = "tcp"
  address = "localhost:9000"   # MOOSDB
  timeout = "3s"
  [inputs.net_response.tags]
    service = "moos"

[[inputs.net_response]]
  protocol = "tcp"
  address = "localhost:8086"   # Database
  timeout = "3s"
  [inputs.net_response.tags]
    service = "influxdb"
