# Telegraf — onboard computer system metrics (FR-9), native deployment.
# Placeholders __INFLUX_TOKEN__ / __INFLUX_ORG__ / __VESSEL_ID__ are filled
# in by deploy/install.sh.
[agent]
  interval = "5s"
  flush_interval = "5s"

[[outputs.influxdb_v2]]
  urls = ["http://localhost:8086"]
  token = "__INFLUX_TOKEN__"
  organization = "__INFLUX_ORG__"
  bucket = "telemetry"

[global_tags]
  vessel = "__VESSEL_ID__"

# --- Host metrics ---
[[inputs.cpu]]
  percpu = false
  totalcpu = true

[[inputs.mem]]

[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "overlay", "squashfs"]

[[inputs.diskio]]

[[inputs.net]]
  ignore_protocol_stats = true

[[inputs.temp]]

[[inputs.system]]

# GPU utilisation for the System dashboard (NVIDIA hosts). Needs nvidia-smi
# on the PATH; leave commented out on hosts without an NVIDIA GPU, the
# dashboard tile then shows "No data".
# [[inputs.nvidia_smi]]
#   timeout = "5s"

# --- Network quality (FR-8): latency + packet loss ---
[[inputs.ping]]
  urls = ["8.8.8.8", "1.1.1.1"]
  count = 3
  ping_interval = 1.0
  timeout = 2.0

# Starlink dish router (vessels only): uncomment where a Starlink is fitted.
# The Comms dashboard's Starlink tile reads N/A while this is disabled.
# [[inputs.ping]]
#   urls = ["192.168.100.1"]
#   count = 3
#   ping_interval = 1.0
#   timeout = 2.0

# --- Service supervision (FR-9): key systemd units ---
[[inputs.systemd_units]]
  pattern = "influxdb.service grafana-server.service telegraf.service usv-signalk-bridge.service usv-signalk-bridge@*.service usv-can-bridge.service signalk.service signalk@*.service moos-antler.service tailscaled.service"

# --- Service reachability (FR-9): Signal K, MOOSDB, InfluxDB ---
[[inputs.net_response]]
  protocol = "tcp"
  address = "localhost:3000"   # Signal K (server web/stream port)
  timeout = "3s"
  [inputs.net_response.tags]
    service = "signalk"

[[inputs.net_response]]
  protocol = "tcp"
  address = "localhost:9000"   # MOOSDB
  timeout = "3s"
  [inputs.net_response.tags]
    service = "moos"

[[inputs.net_response]]
  protocol = "tcp"
  address = "localhost:8086"   # Database
  timeout = "3s"
  [inputs.net_response.tags]
    service = "influxdb"
